  Goddess Temple Discovery vector art
  Title: Crossing the Euphrates at el-Khidr
  Subject: The last stage of the journey: a small boat poled across the flooded Euphrates with luggage piled high, a crossing that once took seven hours.
  Sources consulted: Julius_Jordan_Eanna texts/18_game_season_and_people_cards.txt (A12, C3; Noeldeke letter of 22 December 1937 via texts/11)
  Author: Claude (Opus) for Jeremy Ellis, 2026
