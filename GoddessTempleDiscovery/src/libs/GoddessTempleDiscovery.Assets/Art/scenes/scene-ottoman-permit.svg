  Goddess Temple Discovery vector art
  Title: The Ottoman Permit
  Subject: The envelope that carried the 1912 permit from Constantinople, red seal and all, lying on a survey map of Warka with its city wall and river.
  Sources consulted: Julius_Jordan_Eanna texts/18_game_season_and_people_cards.txt (A0, permit envelope after Getty 2019 fig. 12.4)
  Author: Claude (Opus) for Jeremy Ellis, 2026
  License: Apache License 2.0 (see the LICENSE file at the repository root)
-->
