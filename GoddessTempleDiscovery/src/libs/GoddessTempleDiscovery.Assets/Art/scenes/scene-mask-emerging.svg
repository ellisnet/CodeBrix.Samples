  Goddess Temple Discovery vector art
  Title: The Mask Emerging, 22 February 1939
  Subject: The marble face of the Lady of Uruk half-uncovered in the Eanna soil, dirt still in Her empty eye sockets and brow groove, a brush laid beside it.
  Sources consulted: Julius_Jordan_Eanna texts/18_game_season_and_people_cards.txt (A13); Julius_Jordan_Eanna/images Mask_of_Warka_front.jpg, Mask_of_Warka_profile.jpg, Mask_of_Warka_back.jpg; images/Holy_Inanna mask-of-warka frontal, profile, profile-alt and back photographs (studied for proportion, not traced); art/scenes/scene-mask-emerging.svg (composition kept)
  Author: Claude (Opus) for Jeremy Ellis, 2026
  License: Apache License 2.0 (see the LICENSE file at the repository root)
-->
