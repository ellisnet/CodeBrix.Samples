<!--
  Goddess Temple Discovery vector art
  Title: Deco Button Plate, Active
  Subject: The pressed or selected state of the Deco button: the same chevron-ended plate inverted, night rules and chevrons on a gold ground.
  Sources consulted: ART_BIBLE.md section 6 (Art Deco chrome); art/symbols and art/deities contact sheets (for scale and palette fit)
