  Goddess Temple Discovery vector art
  Title: Deco Board Tile
  Subject: A seamless repeating table-surface tile: a night ground with a very faint gold sunburst at the centre, sunburst rings shared across the corners and chevrons straddling the edge midpoints, every edge element mirrored so the tile repeats without a seam.
  Sources consulted: ART_BIBLE.md section 6 (Art Deco chrome); art/symbols and art/deities contact sheets (for scale and palette fit)
  Author: Claude (Opus) for Jeremy Ellis, 2026
  License: Apache License 2.0 (see the LICENSE file at the repository root)
-->
