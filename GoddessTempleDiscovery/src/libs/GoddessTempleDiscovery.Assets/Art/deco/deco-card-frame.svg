<!--
  Goddess Temple Discovery vector art
  Title: Deco Card Frame
  Subject: The frame of every card: a night ground with a double gold hairline border and stepped corners, a limestone title plate across the top 70 units and a text plate across the bottom 120, the art window left transparent; corners stay inside the outer 60 units for nine-slice stretching.
  Sources consulted: ART_BIBLE.md section 6 (Art Deco chrome); art/symbols and art/deities contact sheets (for scale and palette fit)
  Author: Claude (Opus) for Jeremy Ellis, 2026
  License: Apache License 2.0 (see the LICENSE file at the repository root)
-->
