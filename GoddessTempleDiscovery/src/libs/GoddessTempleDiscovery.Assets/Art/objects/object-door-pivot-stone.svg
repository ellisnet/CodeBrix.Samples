<!--
  Goddess Temple Discovery vector art
  Title: Door Pivot Stone of Amar-Sin
  Subject: A heavy rough block of dark stone set under a temple door, its top worn into a smooth cup where the door post turned, with the royal dedication of Amar-Sin suggested in rows of wedges on a dressed facet.
  Sources consulted: BUILDING_HIGHLIGHTS.txt Deep Temples (outer doors with pivot sockets, inner thresholds without) and the Ur III rebuilding of Eanna; Julius_Jordan_Eanna/temple_buildings/five/03_Ziggurat_of_Urnammu
  Author: Claude (Opus) for Jeremy Ellis, 2026
  License: Apache License 2.0 (see the LICENSE file at the repository root)
-->
