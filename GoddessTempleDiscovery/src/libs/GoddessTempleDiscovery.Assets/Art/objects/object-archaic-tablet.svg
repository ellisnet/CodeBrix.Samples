  Goddess Temple Discovery vector art
  Title: Archaic Accounting Tablet
  Subject: A pillow-shaped clay tablet of the Eanna administration in the age of the first writing, ruled into cases filled with round and D-shaped numeral impressions and tally strokes, its signs only suggested.
