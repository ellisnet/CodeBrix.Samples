<!--
  Goddess Temple Discovery vector art
  Title: Warka Vase, the Top Register
  Subject: The top register of the Warka Vase unrolled flat: an attendant holding the sash of the priest-king, a naked bearer offering a basket of fruit, the Goddess facing them before Her two reed-ring bundles, and the storehouse goods behind Her.
