<!--
  Goddess Temple Discovery vector art
  Title: Karaindash Façade Goddess
  Subject: One water goddess from the moulded baked-brick façade of Karaindash's temple of Inanna, standing in Her niche in a horned crown and flounced robe, holding the round vessel from which the unceasing streams pour down to the ground.
  Sources consulted: images/Holy_Inanna/IMAGES.md section 4 (Karaindash façade deity, Pergamon VA10983 and Iraq Museum); BUILDING_HIGHLIGHTS.txt Karaindash's Temple (the unceasing pour); Julius_Jordan_Eanna/temple_buildings/five/05_Karaindash_Temple
  Author: Claude (Opus) for Jeremy Ellis, 2026
  License: Apache License 2.0 (see the LICENSE file at the repository root)
-->
