  Goddess Temple Discovery vector art
  Title: Lapis and Carnelian Necklace
  Subject: A string of graduated lapis lazuli and carnelian beads with gold spacers and a large biconical carnelian at the centre, after the dedicated necklaces found in Eanna such as the one that carried the name of Tiamatbashti.
