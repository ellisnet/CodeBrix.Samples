  Goddess Temple Discovery vector art
  Title: Inscribed Clay Cone
  Subject: A fired clay foundation cone of the kind Sin-kashid, provider of Eanna, set into the walls of his buildings, its broad head meant to show in the wall and its shaft wrapped in ruled lines of wedges, here only suggested.
  Sources consulted: images/Holy_Inanna/IMAGES.md section 7 (Sin-kashid foundation cone, Oriental Institute Chicago; dedicatory cone, British Museum)
  Author: Claude (Opus) for Jeremy Ellis, 2026
  License: Apache License 2.0 (see the LICENSE file at the repository root)
-->
