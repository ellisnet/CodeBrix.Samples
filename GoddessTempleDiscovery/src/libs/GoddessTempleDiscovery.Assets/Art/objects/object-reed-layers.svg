  Goddess Temple Discovery vector art
  Title: Ziggurat Core with Reed Layers
  Subject: A cut block from the mud-brick core of the ziggurat, courses of sun-dried brick separated by thin layers of reed matting laid crosswise to bind and drain the mass.
  Sources consulted: BUILDING_HIGHLIGHTS.txt Ziggurat of Ur-Nammu (Riemchen-brick archaic ziggurats inside, reed layers in the core); Julius_Jordan_Eanna/images Schwarzenbach_Zikurrat_131.jpg, Schwarzenbach_Zikurrat_137.jpg
  Author: Claude (Opus) for Jeremy Ellis, 2026
  License: Apache License 2.0 (see the LICENSE file at the repository root)
-->
