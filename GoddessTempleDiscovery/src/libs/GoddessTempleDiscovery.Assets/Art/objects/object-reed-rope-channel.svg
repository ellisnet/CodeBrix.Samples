<!--
  Goddess Temple Discovery vector art
  Title: Reed Rope in Its Channel
  Subject: A section of ziggurat brickwork with the square channel left for one of the thick twisted reed ropes that were run through the mass to tie it together, the rope emerging and coiling out onto the ground.
  Sources consulted: BUILDING_HIGHLIGHTS.txt Ziggurat of Ur-Nammu (reed ropes and reed layers in the brick core); Julius_Jordan_Eanna/images Schwarzenbach_Zikurrat_131.jpg
  Author: Claude (Opus) for Jeremy Ellis, 2026
  License: Apache License 2.0 (see the LICENSE file at the repository root)
-->
