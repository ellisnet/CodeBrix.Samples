<!--
  Goddess Temple Discovery vector art
  Title: The Mask of Warka
  Subject: The life-size marble face of the Lady of Uruk found in Eanna in 1939, drawn front-on with its continuous brow groove, deep empty eye sockets that once held inlays, long straight nose, small calm mouth and the hairline groove that anchored a wig.
  Sources consulted: Julius_Jordan_Eanna/images Mask_of_Warka_front.jpg, Mask_of_Warka_profile.jpg, Mask_of_Warka_back.jpg; images/Holy_Inanna mask-of-warka frontal, profile, profile-alt and back photographs (studied for proportion, not traced)
  Author: Claude (Opus) for Jeremy Ellis, 2026
  License: Apache License 2.0 (see the LICENSE file at the repository root)
-->
