  Goddess Temple Discovery vector art
  Title: Clay Cones
  Subject: A handful of the hand-made clay cones, about ten centimetres long, their heads dipped red, black or white, with one shown pushed point-first into mud plaster in a cut-away section as it sat in the mosaic walls of Eanna.
  Sources consulted: Julius_Jordan_Eanna/images Cone_mosaic_panel_IraqMuseum.jpg, Cone_mosaic_wall_Warka_VAM.jpg; BUILDING_HIGHLIGHTS.txt Stone-Cone Building (cones 8-10 cm, driven point-first into mud plaster)
  Author: Claude (Opus) for Jeremy Ellis, 2026
  License: Apache License 2.0 (see the LICENSE file at the repository root)
-->
