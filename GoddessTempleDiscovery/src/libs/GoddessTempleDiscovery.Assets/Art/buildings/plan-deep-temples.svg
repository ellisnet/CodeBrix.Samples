  Goddess Temple Discovery vector art
  Title: Plan of the Deep Temples
  Subject: Schematic ground plan of the two Neo-Babylonian Deep Temples, north up: the north temple (ante-cella and cella) and the larger east temple (with a third room and a wider cult niche) in the angles between the central stair and the two side flights of the ziggurat.
  Sources consulted: temple_buildings/five/01_Deep_Temples/COMPREHENSIVE_BUILDING_OVERVIEW.txt (Jordan 1932 pp. 32-33, Taf. 13-15); temple_buildings/five/03_Ziggurat_of_Urnammu/COMPREHENSIVE_BUILDING_OVERVIEW.txt; scale bar = 20 m
  Author: Claude (Opus) for Jeremy Ellis, 2026
  License: Apache License 2.0 (see the LICENSE file at the repository root)
-->
