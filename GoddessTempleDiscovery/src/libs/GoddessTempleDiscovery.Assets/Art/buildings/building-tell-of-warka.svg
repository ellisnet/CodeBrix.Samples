<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
<!--
  Goddess Temple Discovery vector art
  Title: The Tell of Warka
  Subject: The great mound of Warka as Loftus and Jordan first saw it: a gullied tell with the eroded mudbrick core of the Eanna ziggurat rising from it, reed layers showing in its flanks, black tents and a camel at its foot for scale.
  Sources consulted: images/Uruk_Archaeological_site_at_Warka.jpg; images/Schwarzenbach_Zikurrat_131.jpg; images/Schwarzenbach_Zikurrat_137.jpg; images/temple_buildings/overview/web-wiki_white-temple-anu-ziggurat-modern-photo.jpg
