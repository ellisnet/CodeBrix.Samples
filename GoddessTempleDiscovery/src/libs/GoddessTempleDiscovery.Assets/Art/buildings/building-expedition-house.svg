<!--
  Goddess Temple Discovery vector art
  Title: The Expedition House
  Subject: The German expedition house at Warka from 1928 on: brick rooms round a courtyard, reed huts (sarifa) for the workmen, the tea corner under its mat shade, and one of the expedition's Ford cars.
  Sources consulted: texts/11_noeldeke_letters_sample_summary.txt (two Ford transporters, a Buick from 1933, director's room in the north-west corner); uruk_getty_book/MANIFEST.txt (fig. 66.1 sketch plan of the expedition house 1931/32; fig. 12.3 Ford automobile)
  Author: Claude (Opus) for Jeremy Ellis, 2026
  License: Apache License 2.0 (see the LICENSE file at the repository root)
-->
