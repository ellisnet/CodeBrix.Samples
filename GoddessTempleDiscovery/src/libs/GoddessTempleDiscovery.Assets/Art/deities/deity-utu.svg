<!--
  Goddess Temple Discovery vector art
  Title: Utu, the Rising Sun
  Subject: Utu the sun god, Inanna's brother, rising between the two eastern mountains, rays streaming from his shoulders, his saw-toothed blade raised
  Sources consulted: Getty "Uruk: First City" ch. 9, ch. 11 (seal impressions of enthroned deities, figs. 11 no. 13-11 no. 14), ch. 39 (fig. 39.2 deity enthroned before a temple facade); Holy_Inanna IMAGES.md section 4 (Karaindash relief deities) and section 8 (cylinder seals); ch. 9 (Astral Manifestation: Utu thought of as Her brother)
  Author: Claude (Opus) for Jeremy Ellis, 2026
  License: Apache License 2.0 (see the LICENSE file at the repository root)
-->
