  Goddess Temple Discovery vector art
  Title: An, Lord of Heaven
  Subject: An the sky god as an enthroned elder with long beard and four-tiered horned crown, sceptre in hand, before a lapis heaven studded with stars
  Sources consulted: Getty "Uruk: First City" ch. 9, ch. 11 (seal impressions of enthroned deities, figs. 11 no. 13-11 no. 14), ch. 39 (fig. 39.2 deity enthroned before a temple facade); Holy_Inanna IMAGES.md section 4 (Karaindash relief deities) and section 8 (cylinder seals); ch. 39 (Anu possibly worshipped in the White Temple at Kullab)
