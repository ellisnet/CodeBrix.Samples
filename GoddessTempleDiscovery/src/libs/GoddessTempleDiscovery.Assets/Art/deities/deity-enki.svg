<!--
  Goddess Temple Discovery vector art
  Title: Enki, Lord of the Sweet Waters
  Subject: Enki with the two streams of fresh water flowing from his shoulders, fish swimming in them, and his goat-fish at his feet, the god whose divine powers Inanna won for Uruk
  Sources consulted: Getty "Uruk: First City" ch. 9, ch. 11 (seal impressions of enthroned deities, figs. 11 no. 13-11 no. 14), ch. 39 (fig. 39.2 deity enthroned before a temple facade); Holy_Inanna IMAGES.md section 4 (Karaindash relief deities) and section 8 (cylinder seals); ch. 9 (the myth Inanna and Enki and the mes brought to Uruk)
  Author: Claude (Opus) for Jeremy Ellis, 2026
  License: Apache License 2.0 (see the LICENSE file at the repository root)
-->
