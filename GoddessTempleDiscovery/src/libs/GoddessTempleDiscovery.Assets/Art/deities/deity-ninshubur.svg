<!--
  Goddess Temple Discovery vector art
  Title: Ninshubur, Faithful Minister
  Subject: Ninshubur, Inanna's faithful minister, head bowed in service, staff of office in one hand and the other raised in the gesture of greeting and prayer
  Sources consulted: Getty "Uruk: First City" ch. 9, ch. 11 (seal impressions of enthroned deities, figs. 11 no. 13-11 no. 14), ch. 39 (fig. 39.2 deity enthroned before a temple facade); Holy_Inanna IMAGES.md section 4 (Karaindash relief deities) and section 8 (cylinder seals); ch. 9 (ritual of raised hands, a gesture of greeting and praying); the Descent myth in which Ninshubur rescues Her
  Author: Claude (Opus) for Jeremy Ellis, 2026
  License: Apache License 2.0 (see the LICENSE file at the repository root)
-->
