<!--
  Goddess Temple Discovery vector art
  Title: The Lady of Uruk
  Subject: The Lady of Uruk as the composite cult statue She belonged to: the marble face with inlaid lapis eyes and brows, a gold-sheathed wig over the hairline groove, set on a draped and jewelled body.
  Sources consulted: Getty "Uruk: First City" ch. 11 (fig. 11.1 the Lady of Warka, inlays envisioned for eyes and brows), ch. 39 (part of a composite goddess figure); Julius_Jordan_Eanna/images Mask_of_Warka_front.jpg, Mask_of_Warka_profile.jpg, Mask_of_Warka_back.jpg; images/Holy_Inanna mask-of-warka frontal, profile, profile-alt and back photographs (studied for proportion, not traced)
  Author: Claude (Opus) for Jeremy Ellis, 2026
  License: Apache License 2.0 (see the LICENSE file at the repository root)
-->
