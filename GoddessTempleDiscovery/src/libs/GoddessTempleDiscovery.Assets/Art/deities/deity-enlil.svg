<!--
  Goddess Temple Discovery vector art
  Title: Enlil, Lord Wind
  Subject: Enlil, lord of the wind and king of the gods, striding in horned crown and flounced robe, holding the clay Tablet of Destinies while the wind curls about him
  Sources consulted: Getty "Uruk: First City" ch. 9, ch. 11 (seal impressions of enthroned deities, figs. 11 no. 13-11 no. 14), ch. 39 (fig. 39.2 deity enthroned before a temple facade); Holy_Inanna IMAGES.md section 4 (Karaindash relief deities) and section 8 (cylinder seals); ch. 9 (Nippur, city of the state god Enlil)
  Author: Claude (Opus) for Jeremy Ellis, 2026
  License: Apache License 2.0 (see the LICENSE file at the repository root)
-->
