  Goddess Temple Discovery vector art
  Title: The Priest-King of Uruk
  Subject: The Late Uruk "en", the Great Man of Uruk, with rolled-brim headband, round beard and net skirt, feeding the temple flock with a flowering branch beside Inanna's looped reed bundle
  Sources consulted: Getty "Uruk: First City" ch. 39 (figs. 39.1 the Great Man in a boat; men feeding animals as cult acts), ch. 11 (reed bundle as the sign of Inanna), ch. 20 (Great Man statuettes); Holy_Inanna IMAGES.md section 8.1 (cylinder seal BM 116722, priest-king feeding the flock)
  Author: Claude (Opus) for Jeremy Ellis, 2026
  License: Apache License 2.0 (see the LICENSE file at the repository root)
-->
