<!--
  Goddess Temple Discovery vector art
  Title: Scorpion
  Subject: A scorpion seen from above with raised pincers, eight legs and a segmented tail ending in a red sting, a frequent symbol on Mesopotamian seals and kudurru.
  Sources consulted: Getty Uruk transcript chapter 11 (seal iconography)
  Author: Claude (Opus) for Jeremy Ellis, 2026
  License: Apache License 2.0 (see the LICENSE file at the repository root)
-->
