<!--
  Goddess Temple Discovery vector art
  Title: Dingir (AN) Sign
  Subject: The cuneiform sign AN, read dingir, god, which stood before every divine name: four wedges pressed across one another into an eight-armed star, each wedge with its head at one end and its tail at the other, so four of the eight arms carry heads.
  Sources consulted: Getty Uruk transcript chapters 9, 11 and 28 (Writing Cuneiform)
  Author: Claude (Opus) for Jeremy Ellis, 2026
  License: Apache License 2.0 (see the LICENSE file at the repository root)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<g id="tablet-disc">
<circle cx="200" cy="200" r="176" fill="#E8C597" stroke="#1E1A17" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
</g>
<g id="wedges">
<g transform="rotate(-45 200 200)"><path d="M 50,164 C 64,177 80,185 98,188 L 354,200 L 98,212 C 80,215 64,223 50,236 Z" fill="#9C6B3C" stroke="#1E1A17" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M 57,176 C 67,184 78,189 89,192 L 89,208 C 78,211 67,216 57,224 Z" fill="#E8C597" stroke="#1E1A17" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></g>
