<!--
  Goddess Temple Discovery vector art
  Title: Rayed Disc of Utu
  Subject: The sun emblem of Utu, Her brother, called Shamash in Akkadian: a four-pointed star around a round centre, with three wavy streams of light in each space between its points, all within a ring. Assyrian people still keep this Star of Shamash as a symbol of their own today.
  Sources consulted: Getty Uruk transcript chapter 9 (Astral Manifestation); chapter 11 seal descriptions; Wikimedia Commons, File:Star_of_Shamash.png (form only, drawn anew)
  Author: Claude (Opus) for Jeremy Ellis, 2026
  License: Apache License 2.0 (see the LICENSE file at the repository root)
-->
