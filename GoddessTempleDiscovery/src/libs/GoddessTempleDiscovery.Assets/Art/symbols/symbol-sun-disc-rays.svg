<!--
  Goddess Temple Discovery vector art
  Title: Rayed Disc of Utu
  Subject: The sun disc of Utu, Her brother, with straight and wavy rays alternating and a four-pointed star with wavy streams inside, the Babylonian solar emblem.
  Sources consulted: Getty Uruk transcript chapter 9 (Astral Manifestation); chapter 11 seal descriptions
  Author: Claude (Opus) for Jeremy Ellis, 2026
  License: Apache License 2.0 (see the LICENSE file at the repository root)
-->
