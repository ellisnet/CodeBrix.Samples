<!--
  Goddess Temple Discovery vector art
  Title: Cylinder Seal and Impression
  Subject: A lapis cylinder seal with gold caps standing above the strip of clay it was rolled across, leaving reed bundles, a star and a ring; the seal carries the same scene cut into its stone as a mirror image, wrapped around it, and one turn of the seal prints the strip. The Uruk invention that signed goods and doors.
  Sources consulted: Holy_Inanna/IMAGES.md (Late Uruk cylinder seals MET 1983 and BM 116722); Getty Uruk transcript chapter 11
  Author: Claude (Opus) for Jeremy Ellis, 2026
  License: Apache License 2.0 (see the LICENSE file at the repository root)
-->
