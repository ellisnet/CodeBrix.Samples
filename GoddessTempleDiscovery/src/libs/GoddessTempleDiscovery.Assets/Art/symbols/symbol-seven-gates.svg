<!--
  Goddess Temple Discovery vector art
  Title: Seven Gates of the Netherworld
  Subject: Seven nested arched gateways stepping inward to a dark doorway, the seven gates of Ganzir through which Holy Inanna passed in Her Descent.
  Sources consulted: Getty Uruk transcript chapter 9 (Astral Manifestation, the descent to the netherworld) and chapter 11
  Author: Claude (Opus) for Jeremy Ellis, 2026
  License: Apache License 2.0 (see the LICENSE file at the repository root)
-->
