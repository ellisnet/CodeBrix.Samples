<!--
  Goddess Temple Discovery vector art
  Title: Clay Tablet and Reed Stylus
  Subject: A cushion-shaped clay tablet ruled and impressed with rows of wedges, with the cut reed stylus that made them laid across its corner.
  Sources consulted: Getty Uruk transcript chapter 28 (Writing Cuneiform); chapter 9 (archaic administrative tablet)
  Author: Claude (Opus) for Jeremy Ellis, 2026
  License: Apache License 2.0 (see the LICENSE file at the repository root)
-->
